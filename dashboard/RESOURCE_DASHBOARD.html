<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 资源导航仪表板</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-card: #1a2236;
            --bg-card-hover: #1f2a42;
            --border-color: rgba(99, 143, 255, 0.12);
            --border-hover: rgba(99, 143, 255, 0.3);
            --text-primary: #e8ecf4;
            --text-secondary: #8b95a9;
            --text-muted: #5a6478;
            --accent-blue: #638fff;
            --accent-purple: #a78bfa;
            --accent-green: #34d399;
            --accent-orange: #fb923c;
            --accent-pink: #f472b6;
            --accent-cyan: #22d3ee;
            --accent-red: #f87171;
            --gradient-blue: linear-gradient(135deg, #638fff, #4f6dd4);
            --gradient-purple: linear-gradient(135deg, #a78bfa, #8b5cf6);
            --gradient-green: linear-gradient(135deg, #34d399, #059669);
            --gradient-orange: linear-gradient(135deg, #fb923c, #ea580c);
            --gradient-pink: linear-gradient(135deg, #f472b6, #ec4899);
            --gradient-cyan: linear-gradient(135deg, #22d3ee, #0891b2);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
            --radius: 14px;
            --radius-sm: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background decoration */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 20% 20%, rgba(99, 143, 255, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(167, 139, 250, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(52, 211, 153, 0.03) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px 32px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 48px 0 40px;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(99, 143, 255, 0.1);
            border: 1px solid rgba(99, 143, 255, 0.2);
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 12px;
            color: var(--accent-blue);
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .header h1 {
            font-size: 40px;
            font-weight: 700;
            background: linear-gradient(135deg, #e8ecf4, #638fff, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 16px;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .header .update-time {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 12px;
        }

        /* Search */
        .search-wrapper {
            max-width: 560px;
            margin: 0 auto 40px;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-55%);
            color: var(--text-muted);
            font-size: 18px;
            line-height: 1;
        }

        .search-input {
            width: 100%;
            padding: 14px 18px 14px 48px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(99, 143, 255, 0.1);
        }

        .search-count {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 8px;
            min-height: 20px;
        }

        /* Filter Tags */
        .filter-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 36px;
        }

        .filter-tag {
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            transition: all 0.25s ease;
            user-select: none;
        }

        .filter-tag:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
        }

        .filter-tag.active {
            background: rgba(99, 143, 255, 0.15);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        /* Section */
        .section {
            margin-bottom: 48px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .section-header .icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .section-header h2 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .section-header .count {
            font-size: 13px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 10px;
            border-radius: 10px;
        }

        /* Card Grid */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        /* Card */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 22px;
            transition: all 0.3s ease;
            cursor: default;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover {
            border-color: var(--border-hover);
            background: var(--bg-card-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card[data-category="文档处理"]::before {
            background: var(--gradient-blue);
        }

        .card[data-category="设计创意"]::before {
            background: var(--gradient-purple);
        }

        .card[data-category="开发工具"]::before {
            background: var(--gradient-green);
        }

        .card[data-category="内容创作"]::before {
            background: var(--gradient-orange);
        }

        .card[data-category="MCP工具"]::before {
            background: var(--gradient-cyan);
        }

        .card[data-category="AI大全"]::before {
            background: var(--gradient-pink);
        }

        .card[data-category="工具平台"]::before {
            background: var(--gradient-orange);
        }

        .card-top {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 14px;
        }

        .card-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .card[data-category="文档处理"] .card-icon {
            background: rgba(99, 143, 255, 0.12);
        }

        .card[data-category="设计创意"] .card-icon {
            background: rgba(167, 139, 250, 0.12);
        }

        .card[data-category="开发工具"] .card-icon {
            background: rgba(52, 211, 153, 0.12);
        }

        .card[data-category="内容创作"] .card-icon {
            background: rgba(251, 146, 60, 0.12);
        }

        .card[data-category="MCP工具"] .card-icon {
            background: rgba(34, 211, 238, 0.12);
        }

        .card[data-category="AI大全"] .card-icon {
            background: rgba(244, 114, 182, 0.12);
        }

        .card[data-category="工具平台"] .card-icon {
            background: rgba(251, 146, 60, 0.12);
        }

        .card-info {
            flex: 1;
            min-width: 0;
        }

        .card-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .card-source {
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'SFMono-Regular', 'Consolas', monospace;
        }

        .card-desc {
            font-size: 13.5px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 14px;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 11.5px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
        }

        .tag.tech {
            color: var(--accent-blue);
            background: rgba(99, 143, 255, 0.08);
        }

        .tag.use {
            color: var(--accent-green);
            background: rgba(52, 211, 153, 0.08);
        }

        /* No results */
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 15px;
            display: none;
        }

        .no-results .emoji {
            font-size: 40px;
            margin-bottom: 12px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }

            .header h1 {
                font-size: 28px;
            }

            .card-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Animate in */
        .card {
            animation: fadeInUp 0.4s ease both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <div class="container">

            <div class="emoji">🤷</div>
            <div>没有找到匹配的资源，试试其他关键词？</div>
        </div>
    </div>

        // Render functions
        function createCard(item, isRepo = false) {
            const tagsHtml = item.tags.map(t => `<span class="tag ${t.type}">${t.text}</span>`).join('');
            const sourceHtml = isRepo ? `<div class="card-source">${item.source}</div>` : `<div class="card-source">${item.path}</div>`;
            return `
        <div class="card" data-category="${item.category}" data-keywords="${item.keywords}" data-name="${item.name}">
            <div class="card-top">
                <div class="card-icon">${item.icon}</div>
                <div class="card-info">
                    <div class="card-name">${item.name}</div>
                    ${sourceHtml}
                </div>
            </div>
            <div class="card-desc">${item.desc}</div>
            <div class="card-tags">${tagsHtml}</div>
        </div>
    `;
        }

        function renderCards() {
            document.getElementById('skillsGrid').innerHTML = skills.map(s => createCard(s)).join('');
            document.getElementById('reposGrid').innerHTML = repos.map(r => createCard(r, true)).join('');
        }

        // Search
        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const activeFilter = document.querySelector('.filter-tag.active').dataset.filter;
            const allCards = document.querySelectorAll('.card');
            let visibleCount = 0;

            allCards.forEach((card, i) => {
                const category = card.dataset.category;
                const keywords = card.dataset.keywords;
                const name = card.dataset.name;
                const desc = card.querySelector('.card-desc').textContent;

                const matchesFilter = activeFilter === 'all' || category === activeFilter;
                const matchesSearch = !query ||
                    name.toLowerCase().includes(query) ||
                    desc.toLowerCase().includes(query) ||
                    keywords.includes(query) ||
                    category.includes(query);

                const visible = matchesFilter && matchesSearch;
                card.classList.toggle('hidden', !visible);
                if (visible) {
                    visibleCount++;
                    card.style.animationDelay = `${visibleCount * 0.03}s`;
                }
            });

            // Show/hide sections
            const skillCards = document.querySelectorAll('#skillsGrid .card:not(.hidden)');
            const repoCards = document.querySelectorAll('#reposGrid .card:not(.hidden)');
            document.getElementById('skillsSection').classList.toggle('hidden', skillCards.length === 0);
            document.getElementById('reposSection').classList.toggle('hidden', repoCards.length === 0);
            document.getElementById('noResults').style.display = visibleCount === 0 ? 'block' : 'none';

            // Update count
            const total = skills.length + repos.length;
            document.getElementById('searchCount').textContent = query || activeFilter !== 'all'
                ? `显示 ${visibleCount} / ${total} 个资源`
                : '';
        }

        // Filter tags
        document.getElementById('filterBar').addEventListener('click', e => {
            if (e.target.classList.contains('filter-tag')) {
                document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
                e.target.classList.add('active');
                applyFilters();
            }
        });

        // Search input
        document.getElementById('searchInput').addEventListener('input', applyFilters);

        // Init
        renderCards();
    </script>
